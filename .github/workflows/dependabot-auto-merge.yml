name: Dependabot auto-merge

# Lets Dependabot's pull requests land without a human once — and only once —
# the `main: PR gate` ruleset is satisfied (after the daft repo's workflow of
# the same name). This workflow merges nothing on its own authority: it turns
# on GitHub's auto-merge (squash) for the PR, and GitHub performs the merge
# when the rules hold — `gate` and `pr-title` green on an up-to-date branch.
# The ruleset is the gate; this is the button. No approval step: the ruleset
# asks for none, and an approving bot would be a second thing to trust.
#
# What it will and will not touch:
#   - Only PRs opened by dependabot[bot], only for events dependabot[bot]
#     itself triggered, only against main. A human pushing to a Dependabot
#     branch does not re-arm anything.
#   - Semver-patch always. Semver-minor too — EXCEPT a cargo crate whose major
#     is 0 (ratatui, time): under cargo's own convention 0.x → 0.y is the
#     breaking bump, and green CI is necessary there but not sufficient.
#     Major bumps always wait for a human.
#   - dependabot/fetch-metadata refuses PRs whose commits are not all
#     Dependabot-authored and -signed, so a PR that merely LOOKS like
#     Dependabot's gets nothing.
#   - It fails closed: if `gate` is not a required status check on the base
#     branch (someone loosened the ruleset), it refuses to arm auto-merge
#     rather than let a PR merge on no checks at all.
#
# Why `pull_request` and not `pull_request_target`: nothing here checks out
# code or needs a secret beyond GITHUB_TOKEN, and `pull_request` keeps the run
# in the PR's own read-only-by-default context. The job-level `permissions:`
# grant is the documented way for a Dependabot-triggered run to get the two
# scopes that enabling auto-merge needs — the one write grant in this repo's
# workflows, reachable only through the `if:` below.
#
# A merged bump is a `chore(...)` subject: it cuts no release.

on:
  pull_request:
    types: [opened, reopened, synchronize]

# Nothing at the workflow level; the one job asks for exactly what it uses.
permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    # github.actor is the account whose action triggered the event; for a
    # Dependabot-opened PR that Dependabot itself (re)pushes, both are
    # dependabot[bot]. All four conditions are GitHub-controlled values.
    if: >-
      github.repository == 'avihut/coding-agent-usage-tracker' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # enablePullRequestAutoMerge / merge
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      # Fail closed. Auto-merge is only safe because the ruleset refuses to
      # merge until `gate` passes; if that rule is ever removed, arming
      # auto-merge would merge a PR on no checks at all.
      - name: Require gate to be a required status check on the base branch
        run: |
          set -euo pipefail
          rules=$(gh api "repos/${GH_REPO}/rules/branches/${BASE_REF}")
          if ! echo "$rules" | jq -e '
              [ .[] | select(.type == "required_status_checks")
                    | .parameters.required_status_checks[]? | .context ]
              | index("gate") != null' >/dev/null; then
            echo "::error::gate is not a required status check on ${BASE_REF}; refusing to enable auto-merge. Restore .github/rulesets/main-pr-gate.json."
            exit 1
          fi
          echo "gate is required on ${BASE_REF}"

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          PREVIOUS: ${{ steps.metadata.outputs.previous-version }}
          DEPS: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          set -euo pipefail
          merge=false
          case "$UPDATE_TYPE" in
          version-update:semver-patch) merge=true ;;
          version-update:semver-minor)
              merge=true
              # cargo: 0.x → 0.y is the breaking bump.
              if [ "$ECOSYSTEM" = "cargo" ]; then
                  case "$PREVIOUS" in 0.* | "") merge=false ;; esac
              fi
              ;;
          esac
          echo "merge=$merge" >>"$GITHUB_OUTPUT"
          if [ "$merge" = false ]; then
              echo "::notice::Not auto-merging: ${UPDATE_TYPE:-unknown update type} of ${DEPS} (${ECOSYSTEM}, from ${PREVIOUS:-?}). A human reviews this one."
          fi

      - name: Enable auto-merge (squash)
        if: steps.decide.outputs.merge == 'true'
        run: |
          set -euo pipefail
          # Idempotent across re-runs (Dependabot rebases push `synchronize`):
          # auto-merge already armed -> nothing to do. Already mergeable (every
          # rule satisfied — only possible when CI finished before this job) ->
          # a plain squash merge; GitHub still enforces the ruleset on it, and
          # github-actions[bot] holds no bypass. Otherwise arm auto-merge and
          # let GitHub merge when the rules hold.
          state=$(gh pr view "$PR_URL" --json autoMergeRequest,mergeStateStatus)
          if [ "$(echo "$state" | jq -r '.autoMergeRequest != null')" = "true" ]; then
            echo "auto-merge already enabled"
            exit 0
          fi
          if [ "$(echo "$state" | jq -r '.mergeStateStatus')" = "CLEAN" ]; then
            echo "PR is already mergeable; merging (squash)"
            gh pr merge --squash "$PR_URL"
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
          echo "auto-merge enabled (squash); GitHub merges when gate is green"
